version: 2
updates:
  # Maintain npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Collapse routine bumps into a single PR; majors still open individually for review.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Astro is upgraded manually (jumped 5.x -> 7.x); don't auto-open major bumps.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Action bumps are low-risk; batch all of them (incl. majors) into one PR.
    groups:
      github-actions:
        patterns: ["*"]
