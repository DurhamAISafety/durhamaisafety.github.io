# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# DAISI content editor (Sveltia CMS). Non-technical maintainers edit content here;
# each save opens a pull request (editorial workflow) for review before it goes live.
# Docs: https://sveltiacms.app/en/docs

backend:
  name: github
  repo: DurhamAISafety/durhamaisafety.github.io
  branch: main # production branch the site deploys from
  # Auth uses Netlify's built-in GitHub OAuth provider (no base_url needed).
  # See ACTION_REQUIRED.md for the one-time OAuth setup.

# Edits go through a pull request instead of committing straight to the branch.
publish_mode: editorial_workflow

# Uploaded images (e.g. committee photos) land in public/images and are referenced as /images/...
media_folder: public/images
public_folder: /images

# Each entry below maps to one existing content file. Fields mirror that file's
# structure, so nothing outside these fields is touched on save.
singletons:
  - name: people
    label: People / Committee
    file: src/content/people.yml
    icon: group
    description: Committee members and alumni shown on the About and Alumni pages.
    fields:
      - name: people
        label: People
        label_singular: Person
        widget: list
        summary: '{{fields.name}} — {{fields.role}}'
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string }
          - {
              name: type,
              label: Type,
              widget: select,
              options: [member, alumnus],
              default: member,
            }
          - { name: start_year, label: Start year, widget: number, value_type: int, required: false }
          - { name: years_active, label: Years active (e.g. 2024-2026), widget: string, required: false }
          - { name: photo, label: Photo, widget: image, required: false, media_folder: '/public/images/people', public_folder: '/images/people' }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: durham-staff-link, label: Durham staff page URL, widget: string, required: false }
          - { name: link, label: Personal website URL, widget: string, required: false }
          - { name: description, label: Short description, widget: text, required: false }

  - name: research
    label: Research papers
    file: src/content/research-papers.yml
    icon: science
    description: Papers and projects listed on the Research page.
    fields:
      - name: papers
        label: Papers & projects
        label_singular: Paper
        widget: list
        summary: '{{fields.title}} ({{fields.year}})'
        fields:
          - { name: title, label: Title, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: thumbnail, label: Thumbnail image, widget: image, required: false, media_folder: '/public/images/research', public_folder: '/images/research' }
          - name: authors
            label: Authors
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name (e.g. "Leask, P."), widget: string }
              - { name: team, label: DAISI member?, widget: boolean, default: false, required: false }
          - { name: year, label: Year, widget: number, value_type: int }
          - { name: month, label: Month (1-12, for ordering), widget: number, value_type: int, required: false }
          - { name: venue, label: Venue, widget: string }
          - { name: tags, label: Tags, widget: list, field: { name: tag, label: Tag, widget: string } }
          - {
              name: type,
              label: Type,
              widget: select,
              options: [academic, non-academic],
              default: academic,
            }

  - name: supporters
    label: Supporters
    file: src/content/supporters.yml
    icon: handshake
    description: Supporter/sponsor logos shown across the site.
    fields:
      - name: supporters
        label: Supporters
        label_singular: Supporter
        widget: list
        fields:
          - { name: logo, label: Logo image, widget: image, media_folder: '/public/images/supporters', public_folder: '/images/supporters' }
          - { name: link, label: Website URL, widget: string }

  - name: site_config
    label: Site config
    file: src/content/site-config.json
    icon: settings
    description: Global site details — contact email, social links, header/footer navigation, and calendar.
    fields:
      - { name: title, label: Site title, widget: string }
      - { name: description, label: Site description (used for SEO / social previews), widget: text }
      - { name: email, label: Contact email, widget: string }
      - { name: ogImage, label: Social share image, widget: image, required: false, media_folder: '/public/images', public_folder: '/images' }
      - name: socialLinks
        label: Social & important links
        label_singular: Link
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: icon, label: Icon (SVG), widget: image, media_folder: '/public/images/icons', public_folder: '/images/icons' }
          - { name: inHeader, label: Show in header?, widget: boolean, default: true }
      - name: navigation
        label: Navigation
        widget: object
        fields:
          - name: main
            label: Main menu
            label_singular: Menu item
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
          - name: cta
            label: Call-to-action button
            widget: object
            fields:
              - { name: title, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
      - { name: footerTagline, label: Footer tagline, widget: text, required: false }
      - name: calendar
        label: Luma calendar
        widget: object
        fields:
          - { name: lumaCalendarId, label: Calendar ID, widget: string }
          - { name: lumaCalendarSlug, label: Calendar slug, widget: string }

  - name: get_involved
    label: Get Involved cards
    file: src/content/get-involved.yml
    icon: volunteer_activism
    description: The action cards shown on the Get Involved page.
    fields:
      - name: cards
        label: Cards
        label_singular: Card
        widget: list
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: icon, label: Icon (Font Awesome class, e.g. fas fa-envelope), widget: string }
          - { name: link_url, label: Link URL, widget: string }
          - { name: link_label, label: Link label, widget: string }
          - { name: external, label: Opens an external site?, widget: boolean, default: false }
          - { name: featured, label: Featured (shown at top)?, widget: boolean, default: false }
          - { name: recommended_label, label: Recommended badge text, widget: string, required: false }

  - name: home_page
    label: Home page
    file: src/content/pages/home.yml
    icon: home
    description: Hero text and section headings on the home page.
    fields:
      - name: home
        label: Home page
        widget: object
        fields:
          - { name: heroTitle, label: Hero title, widget: string, hint: 'Use _italic_ or **bold** for emphasis.' }
          - { name: heroSubtitleHighlight, label: Hero subtitle (highlighted part), widget: string }
          - { name: heroSubtitleMain, label: Hero subtitle (rest), widget: string }
          - { name: heroPrimaryCtaText, label: Primary button text, widget: string }
          - { name: heroPrimaryCtaLink, label: Primary button link, widget: string }
          - { name: heroSecondaryCtaText, label: Secondary button text, widget: string }
          - { name: heroSecondaryCtaLink, label: Secondary button link, widget: string }
          - { name: eventsTitle, label: Events section title, widget: string }
          - { name: programmesTitle, label: Programmes section title, widget: string }
          - { name: researchTitle, label: Research section title, widget: string }
          - { name: researchSubtitle, label: Research section subtitle, widget: string }
          - { name: researchViewAllText, label: 'Research "view all" button text', widget: string }

  - name: about_page
    label: About page
    file: src/content/pages/about.yml
    icon: info
    description: Intro, mission cards, impact and join text on the About page.
    fields:
      - name: about
        label: About page
        widget: object
        fields:
          - { name: introText, label: Intro text, widget: text, hint: 'Markdown supported: **bold**, _italic_, [links](https://example.com).' }
          - name: missionCards
            label: Mission cards
            label_singular: Card
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: icon, label: Icon (Font Awesome class), widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - { name: impactTitle, label: Impact section title, widget: string }
          - { name: impactIcon, label: Impact icon (Font Awesome class), widget: string }
          - { name: impactText, label: Impact text, widget: text, hint: 'Markdown supported: **bold**, _italic_, [links](https://example.com).' }
          - { name: joinTitle, label: Join section title, widget: string }
          - { name: joinText, label: Join text, widget: text, hint: 'Markdown supported: **bold**, _italic_, [links](https://example.com).' }
