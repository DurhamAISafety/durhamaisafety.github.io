faqs:
  - question: Do I need a background in AI or STEM to join?
    answer: No. All Durham students are welcome, and you don't need to know lots about AI or do a STEM subject. Whatever your expertise, you can contribute to the conversation and make a difference.
  - question: Who can get involved?
    answer: DAISI is for Durham students and academics interested in reducing catastrophic risks from advanced AI.
  - question: Does it cost anything? Do I have to join the Students' Union group?
    answer: 'No. We keep our resources free for everyone. Durham students can join us officially [through the Students'' Union](https://www.durhamsu.com/groups/studentgroup/6129/), but official membership is just for the records.'
  - question: How do I hear about upcoming events?
    answer: 'Our upcoming events are listed on the [events calendar](/#events), which you can add to your own calendar. You can also [join our Discord](https://forms.office.com/pages/responsepage.aspx?id=i9hQcmhLKUW-RNWaLYpvlEQMKT_SiZBCt87btAf__xhUQlRIVUdZSk5MUEJYSEFLQ0lUMFI1Wk41Ty4u) to hear about new opportunities first, or follow [@ais_durham on Instagram](https://www.instagram.com/ais_durham).'
  - question: How do I get started?
    answer: 'Come along to an upcoming event or join our Discord. See [Get Involved](/get-involved/) for more ways to take part.'
  - question: I want to help run DAISI. How do I join the team?
    answer: 'If you want to help organise and shape DAISI, contact [durhamaisi@durham.ac.uk](mailto:durhamaisi@durham.ac.uk) and we''ll be in touch!'
