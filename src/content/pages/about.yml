about:
  introText: 'We are a [student-led](#team) initiative that aims to empower students and academics to [reduce risk from advanced AI](/#what-is-ai-safety), by:'
  missionCards:
    - icon: fas fa-bullhorn
      title: Raising Awareness
      description: 'Through discussion groups, seminars and speaker events.'
    - icon: fas fa-tools
      title: Upskilling Members
      description: In safety techniques through workshops and 1-1 support
    - icon: fas fa-users
      title: Fostering Community
      description: 'For high-quality discussion, support and connections to the wider field of AI safety'
  impactTitle: Our Impact
  impactIcon: fas fa-chart-line
  impactText: 'Our members have published in top AI and law conferences, participated in [MATS](https://www.matsprogram.org/), [LASR Labs](https://www.lasrlabs.org/), and gone on to study AI ethics at Cambridge.'
  joinTitle: Join Our Team
  joinText: 'If you want to help organise and shape DAISI, contact [durhamaisi@durham.ac.uk](mailto:durhamaisi@durham.ac.uk) and we''ll be in touch!'
