programmes:
  - title: Intro Fellowship
    icon: fas fa-chalkboard-teacher
    image: /images/programmes/ais101.webp
    application_url: https://forms.gle/ynSsCWdxRMfdH5VG9
    homepage_feature:
      eyebrow: Your starting point in AI safety
      description: 'Build your understanding of AI safety with a welcoming group of curious people. Explore the big ideas, ask questions and discover how you could help shape the future of AI.'
      highlights:
        - Get to grips with AI alignment and governance
        - Work through the big questions in group discussions
        - Join a community that shares your curiosity
      application_label: Apply for the fellowship
    short_description: 'An accessible introduction to AI safety, exploring core ideas in alignment and governance through group discussion. No technical background needed.'
    long_description: |
      Our Intro Fellowship is designed to make AI safety accessible to people from all backgrounds and areas of study.
      We explore core ideas in AI alignment and governance in a welcoming environment, with plenty of space for questions and group discussion.

      No technical background or prior knowledge is needed — just curiosity about AI and how we can help it go well.
    tags:
      - icon: fas fa-users
        label: No technical background needed
    whos_this_for:
      - icon: fas fa-graduation-cap
        text: No technical background or prior knowledge required. Open to anyone interested in learning more about AI safety.
  - title: Viewing Sessions and Discussions
    icon: fas fa-comments
    image: /images/programmes/reading-groups.avif
    short_description: 'Watch AI videos and documentaries together, then discuss the ideas, questions and implications for society. Everyone welcome.'
    long_description: |
      Join us to watch videos and documentaries about AI, then discuss what they mean for us and the wider world.
      These sessions are a chance to ask questions, hear different perspectives and explore AI safety together.

      Explore the AI in Context videos and The AI Doc trailer below for a taste of the topics we can discuss. No technical background or preparation is needed.
    tags:
      - icon: fas fa-users
        label: Everyone welcome
    whos_this_for:
      - icon: fas fa-graduation-cap
        text: 'Anyone curious about AI and its impact on society. Come along to watch, ask questions and share your perspective — no prior knowledge required.'
    feature_boxes:
      heading: Watch and Discuss
      items:
        - icon: fas fa-play
          title: We're Not Ready for Superintelligence
          description: AI in Context explores the AI 2027 scenario and what rapid AI progress could mean for our future.
          link: https://www.youtube.com/watch?v=5KVDDfAkRgc
          link_label: Watch on YouTube
        - icon: fas fa-play
          title: If Anyone Builds It, Everyone Dies
          description: AI in Context discusses the book's arguments about the risks of superintelligent AI.
          link: https://www.youtube.com/watch?v=Nl7-bRFSZBs&t=443s
          link_label: Watch on YouTube
        - icon: fas fa-film
          title: The AI Doc
          description: 'Watch the trailer for The AI Doc: Or How I Became an Apocaloptimist, a documentary exploring the promise and risks of AI.'
          link: https://www.youtube.com/watch?v=xkPbV3IRe4Y
          link_label: Watch the trailer
  - title: Research Project Support
    icon: fas fa-terminal
    image: /images/programmes/research-support.webp
    cta: email
    short_description: 'We support you to pursue AI safety research. We can support applications for fellowships and funding, and advise students on dissertation and independent study projects.'
    long_description: |
      Interested in AI Safety research? We can support you to pursue it.

      If you're interested, please reach out to chat with us (email in footer).
      Students: please include your resume/CV and a brief description of your interest in AIS research.

      See [past research by DAISI members](/research/).
    tags:
      - icon: fas fa-graduation-cap
        label: Faculty & Students
    whos_this_for:
      - icon: fas fa-user-graduate
        text: Faculty members interested in AI Safety who want signposting to funding opportunities and connections to researchers in the field.
      - icon: fas fa-users
        text: 'Students who have past research experience, strong background in programming, or compelling demonstrated interest in AI safety.'
    feature_boxes:
      heading: We Can Help With
      items:
        - icon: fas fa-dollar-sign
          title: Funding Opportunities
          description: Support suitable funding applications.
          link: 'https://www.aisafety.com/funding'
          link_label: Funding Opportunities
        - icon: fas fa-graduation-cap
          title: Dissertations
          description: Advice on AI Safety dissertation topics and independent study projects.
          link: /documents/ai-safety-project-support.pdf
          link_label: Dissertation support PDF
        - icon: fas fa-award
          title: Fellowships
          description: 'Support for applying to competitive fellowships like MATS, ERA and SPAR.'
          link: 'https://www.aisafety.com/events-and-training'
          link_label: Upcoming AIS Opps
  - title: Speaker Events
    icon: fas fa-microphone
    image: /images/programmes/speaker-events.webp
    short_description: Insightful talks by leading researchers and industry professionals on AI safety and the latest research.
    long_description: |
      These events offer a unique opportunity to explore emerging topics in the field, engage directly with speakers, and connect with others who share your interest in ensuring AI development benefits humanity.

      To get involved and hear about upcoming speaker events, please join our [Discord server](social:discord).
    tags:
      - icon: fas fa-door-open
        label: Open to all
    whos_this_for:
      - icon: fas fa-graduation-cap
        text: People from any background who are keen to engage with experts in the field of AI safety and learn more about the latest developments.
  - title: Social Events
    icon: fas fa-users
    image: /images/programmes/social-events.webp
    short_description: Relaxed socials to connect and build community.
    long_description: |
      Building community is our most important goal. Our social events provide relaxed, fun environments where both members and non-members can connect.

      These events are open to all and are a great way to meet people who share your interest in AI safety while enjoying some downtime together.
    tags:
      - icon: fas fa-heart
        label: Everyone welcome
    whos_this_for:
      - icon: fas fa-heart
        text: All members looking to connect with the community in a relaxed setting.
      - icon: fas fa-smile
        text: Perfect for newcomers wanting to meet people.
      - icon: fas fa-coffee
        text: Anyone who enjoys deep conversations over food and games.
    feature_boxes:
      heading: Previously We've Done
      items:
        - icon: fas fa-utensils
          title: Free Pizza Socials
          description: Casual pizza nights where we get to know each other better.
        - icon: fas fa-brain
          title: Pub Quizzes
          description: Fun trivia nights testing knowledge across various topics — not just AI!
        - icon: fas fa-dice
          title: Board Games
          description: 'Strategy games, party games, and classics — something for everyone to enjoy.'
